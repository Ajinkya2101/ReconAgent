{% from "_macros.html" import tag %}
{% for c in store.carried_in() %}
<div class="day day--incoming">
  <span class="day-face">
    {{ tag(c.date, "tag--lg") }}
    <span class="day-stats">
      <span class="day-money">{{ c.units|num }} units</span>
      <span class="day-sub">carried in · awaiting MIPS correction</span>
    </span>
  </span>
</div>
{% endfor %}
