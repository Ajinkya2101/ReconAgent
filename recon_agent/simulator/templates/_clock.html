{% set s = clock.state() %}
<div id="clock" class="clock" hx-target="this" hx-swap="outerHTML"{% if oob %} hx-swap-oob="true"{% endif %}
     data-sim="{{ (now.timestamp() * 1000)|int }}" data-rate="{{ s.rate }}" data-paused="{{ 'true' if s.paused else 'false' }}">
  <div class="clock-read">
    <span class="stat-k">Plant time</span>
    <b class="clock-now" data-clock-now>{{ now.strftime("%a %m/%d %H:%M:%S") }}</b>
    <span class="clock-state">{% if s.paused %}paused{% else %}×{{ "%g"|format(s.rate) }}{% endif %}</span>
  </div>
  <div class="clock-ctl" role="group" aria-label="Clock controls">
    {% if s.paused %}
    <button class="btn btn--sm btn--on-ink" hx-post="/clock" hx-vals='{"action": "resume"}'>Resume</button>
    {% else %}
    <button class="btn btn--sm btn--on-ink" hx-post="/clock" hx-vals='{"action": "pause"}'>Pause</button>
    {% endif %}
    {% for r in RATES %}
    <button class="btn btn--sm btn--on-ink{% if r == s.rate %} is-on{% endif %}" hx-post="/clock" hx-vals='{"action": "rate", "value": "{{ r }}"}' aria-pressed="{{ 'true' if r == s.rate else 'false' }}" title="{{ r }} plant seconds per real second">×{{ r }}</button>
    {% endfor %}
    <button class="btn btn--sm btn--on-ink" hx-post="/clock" hx-vals='{"action": "advance", "value": "15m"}'>+15 min</button>
    <button class="btn btn--sm btn--on-ink" hx-post="/clock" hx-vals='{"action": "advance", "value": "1h"}'>+1 h</button>
  </div>
  {% if clock_error %}<p class="notice notice--err" role="alert">{{ clock_error }}</p>{% endif %}
</div>
